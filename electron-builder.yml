appId: com.molinelty.moly
productName: Moly

directories:
  output: release
  buildResources: build

files:
  - electron/**
  - '!node_modules'
  - '!node_modules/**'

asar: true

extraResources:
  - from: .next/standalone
    to: standalone

afterPack: scripts/after-pack.cjs

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Moly-Setup-${version}.${ext}

compression: maximum
