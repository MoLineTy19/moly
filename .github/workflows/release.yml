# Сборка десктоп-установщика (.exe) и публикация в GitHub Release.
# Запуск: push тега v* (релиз) или вручную через workflow_dispatch (только артефакт).
# Runner windows-latest: better-sqlite3 компилируется из исходников под ABI
# Electron, нужны VS Build Tools и Python (на windows-latest предустановлены).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # для создания GitHub Release и загрузки ассетов

    steps:
      - uses: actions/checkout@v4

      - name: Установить Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Бинарник Electron (~150 МБ) и заголовки .electron-gyp для компиляции
      # нативных модулей. Без кэша каждый билд тянет их заново.
      - name: Кэш Electron и заголовков
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\.electron-gyp
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

      - name: Установить зависимости
        run: npm ci

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm version "${{ github.ref_name }}".TrimStart('v') --no-git-tag-version

      # next build (standalone) + electron-rebuild + prebuild + electron-builder
      - name: Собрать установщик
        run: npm run electron:build
        env:
          # Чтобы electron-builder не упёрся в лимит запросов к GitHub API
          # при скачивании Electron и вспомогательных бинарников.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Moly-Setup
          path: release/Moly-Setup-*.exe
          if-no-files-found: error

      # Релиз создаётся только при запуске по тегу. При ручном запуске
      # (workflow_dispatch) установщик доступен только как артефакт.
      - name: Опубликовать GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Moly-Setup-*.exe
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
